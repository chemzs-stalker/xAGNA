name: release

# Cut a test snapshot or a full release from the Actions tab: pick "release", click
# "Run workflow", type the version, and (for a test build) leave the pre-release box ticked.
# It zips the tracked mod tree and publishes a GitHub release with that zip attached.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag, e.g. 1.05-snapshot for a test build or 1.05 for a release"
        required: true
        default: "1.05-snapshot"
      prerelease:
        description: "Mark as a pre-release test build"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build mod zip
        run: git archive --format=zip -o "xAGNA-${{ inputs.version }}.zip" HEAD
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ inputs.version }}" \
            "xAGNA-${{ inputs.version }}.zip" \
            --title "xAGNA ${{ inputs.version }}" \
            --notes-file doc/changelog \
            ${{ inputs.prerelease && '--prerelease' || '' }}
